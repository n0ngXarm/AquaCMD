[server]
http_port = 3000

[paths]
data = /var/lib/grafana
plugins = /opt/grafana-plugins
provisioning = /etc/grafana/provisioning

[security]
admin_user = aqua-lab-admin
admin_password = $__file{/run/secrets/admin-password}
secret_key = $__file{/run/secrets/grafana-key}
allow_embedding = false
cookie_samesite = strict
disable_gravatar = true

[auth.anonymous]
enabled = false

[users]
allow_sign_up = false
allow_org_create = false
default_theme = dark

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[plugins]
preinstall_disabled = true

[dataproxy]
logging = false
timeout = 5

[log]
mode = console
level = warn

[dashboards]
default_home_dashboard_path = /etc/grafana/dashboards/f3.json
